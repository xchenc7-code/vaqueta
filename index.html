
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<title>¿Cuánto pesa la vaqueta?</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top left, #ffd6e7, transparent 35%),
        radial-gradient(circle at bottom right, #d8c7ff, transparent 35%),
        linear-gradient(135deg, #fff0f7, #eee5ff);

    overflow: auto;
    padding: 30px 0;
}

.card {
    width: 90%;
    max-width: 560px;

    background: rgba(255,255,255,0.88);

    padding: 45px 35px;

    border-radius: 35px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(120, 70, 130, 0.2),
        inset 0 0 20px rgba(255,255,255,0.8);

    backdrop-filter: blur(15px);
}

h1 {
    margin-bottom: 10px;

    font-size: 32px;

    background: linear-gradient(90deg, #ff4f91, #9b5cff);

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    font-weight: 900;
}

.subtitle {
    font-size: 22px;
    font-weight: bold;
    color: #8b4d75;
}

.question {
    color: #777;
    font-size: 17px;
}

input {
    margin-top: 10px;

    width: 180px;

    padding: 15px;

    font-size: 24px;

    text-align: center;

    border-radius: 18px;

    border: 3px solid #f3b5d1;

    outline: none;

    background: white;
}

input:focus {
    border-color: #b77aff;

    box-shadow: 0 0 20px rgba(183,122,255,0.3);
}

button {
    margin-top: 20px;

    padding: 14px 25px;

    border: none;

    border-radius: 20px;

    font-size: 17px;

    font-weight: bold;

    color: white;

    background: linear-gradient(90deg, #ff4f91, #9b5cff);

    cursor: pointer;

    transition: 0.25s;
}

button:hover {
    transform: scale(1.06);
}

.history-button {
    background: linear-gradient(90deg, #6c63ff, #9b5cff);
}

#message {
    margin-top: 30px;

    font-size: 19px;

    line-height: 1.6;
}

.result {
    margin-top: 20px;

    padding: 20px;

    border-radius: 25px;

    background: white;
}

.big {
    font-size: 34px;

    font-weight: 900;

    margin: 10px 0;
}

.muuu {
    color: #b56b00;
}

.ole {
    color: #e83f8f;
}

.same {
    color: #777;
}

.small {
    color: #888;

    font-size: 16px;
}

#history {
    margin-top: 30px;

    display: none;
}

.history-title {
    font-size: 23px;

    font-weight: bold;

    color: #8b4d75;

    margin-bottom: 15px;
}

.history-item {
    background: white;

    margin: 10px 0;

    padding: 14px;

    border-radius: 18px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.06);
}

.history-date {
    color: #999;

    font-size: 14px;
}

.history-weight {
    font-size: 22px;

    font-weight: bold;

    color: #9b5cff;
}

.chart-box {
    margin-top: 25px;

    padding: 20px;

    background: white;

    border-radius: 25px;
}

.chart-title {
    font-size: 20px;

    font-weight: bold;

    color: #8b4d75;

    margin-bottom: 15px;
}

</style>

</head>


<body>

<div class="card">

<h1>¿Cuánto pesa la vaqueta? 🐮</h1>

<div class="subtitle">
¡Hola, Tanqueta! 💗
</div>

<p class="question">
Introduce el peso de hoy:
</p>

<input
    id="peso"
    type="number"
    step="0.1"
    placeholder="kg"
>

<br>

<button onclick="guardar()">
GUARDAR 💾
</button>

<br>

<button
    class="history-button"
    onclick="mostrarHistorial()"
>
📜 VER EL HISTORIAL
</button>

<div id="message"></div>


<div id="history">

    <div class="history-title">
        📜 Historial de Tanqueta
    </div>

    <div id="historyList"></div>


    <div class="chart-box">

        <div class="chart-title">
            📈 Evolución de los registros
        </div>

        <canvas id="grafica"></canvas>

    </div>

</div>

</div>


<script>

let grafica = null;


function obtenerHistorial() {

    let historial =
        localStorage.getItem("historialTanqueta");

    if (historial === null) {

        return [];

    }

    return JSON.parse(historial);

}



function guardar() {

    let peso = parseFloat(
        document.getElementById("peso").value
    );


    if (isNaN(peso)) {

        document.getElementById("message").innerHTML =

        "<div class='result'>" +

        "😑 Primero escribe algo..." +

        "</div>";

        return;

    }


    let historial = obtenerHistorial();


    let anterior = null;


    if (historial.length > 0) {

        anterior =
            historial[historial.length - 1].peso;

    }


    let ahora = new Date();


    let fecha =
        ahora.toLocaleDateString("es-ES");


    historial.push({

        fecha: fecha,

        peso: peso

    });


    localStorage.setItem(

        "historialTanqueta",

        JSON.stringify(historial)

    );


    if (anterior === null) {

        document.getElementById("message").innerHTML =

        "<div class='result'>" +

        "💾 ¡Guardado!" +

        "<div class='big'>" +

        peso.toFixed(1) +

        " kg" +

        "</div>" +

        "😈 Primera vez..." +

        "<br>" +

        "Esto acaba de empezar." +

        "</div>";

    }


    else {

        let cambio = peso - anterior;


        let resultado = "";


        if (cambio > 0) {

            resultado =

            "<div class='result'>" +

            "💾 ¡Guardado!" +

            "<br><br>" +

            "Dato de hoy: <b>" +

            peso.toFixed(1) +

            " kg</b>" +

            "<br>" +

            "Dato anterior: <b>" +

            anterior.toFixed(1) +

            " kg</b>" +

            "<div class='big muuu'>" +

            "🐮 MUUUUUUUU" +

            "</div>" +

            "<div class='big muuu'>" +

            "NO PUEDE SER 😂" +

            "</div>" +

            "<div class='small'>" +

            "El número ha cambiado " +

            cambio.toFixed(1) +

            " kg." +

            "</div>" +

            "</div>";

        }


        else if (cambio < 0) {

            resultado =

            "<div class='result'>" +

            "💾 ¡Guardado!" +

            "<br><br>" +

            "Dato de hoy: <b>" +

            peso.toFixed(1) +

            " kg</b>" +

            "<br>" +

            "Dato anterior: <b>" +

            anterior.toFixed(1) +

            " kg</b>" +

            "<div class='big ole'>" +

            "💃 OLEEEEEEE" +

            "</div>" +

            "<div class='small'>" +

            "El número ha cambiado " +

            Math.abs(cambio).toFixed(1) +

            " kg." +

            "</div>" +

            "</div>";

        }


        else {

            resultado =

            "<div class='result'>" +

            "💾 ¡Guardado!" +

            "<br><br>" +

            "<div class='big same'>" +

            "😐 NI SE MUEVE" +

            "</div>" +

            "<div class='small'>" +

            "Exactamente igual que la última vez." +

            "</div>" +

            "</div>";

        }


        document.getElementById("message").innerHTML =
            resultado;

    }


    document.getElementById("peso").value = "";

}



function mostrarHistorial() {

    let historial = obtenerHistorial();


    let historyDiv =
        document.getElementById("history");


    let lista =
        document.getElementById("historyList");


    historyDiv.style.display = "block";


    if (historial.length === 0) {

        lista.innerHTML =

        "<div class='history-item'>" +

        "Todavía no hay registros 😭" +

        "</div>";

        return;

    }


    let contenido = "";


    for (
        let i = historial.length - 1;
        i >= 0;
        i--
    ) {

        contenido +=

        "<div class='history-item'>" +

        "<div class='history-date'>" +

        "📅 " +
        historial[i].fecha +

        "</div>" +

        "<div class='history-weight'>" +

        historial[i].peso.toFixed(1) +

        " kg" +

        "</div>" +

        "</div>";

    }


    lista.innerHTML = contenido;


    crearGrafica(historial);

}



function crearGrafica(historial) {

    let ctx =
        document.getElementById("grafica");


    if (grafica !== null) {

        grafica.destroy();

    }


    let fechas =
        historial.map(r => r.fecha);


    let pesos =
        historial.map(r => r.peso);


    grafica = new Chart(ctx, {

        type: "line",

        data: {

            labels: fechas,

            datasets: [{

                label: "Registro",

                data: pesos,

                tension: 0.35,

                borderWidth: 3,

                pointRadius: 6,

                fill: false

            }]

        },

        options: {

            responsive: true,

            plugins: {

                legend: {

                    display: false

                }

            },

            scales: {

                y: {

                    title: {

                        display: true,

                        text: "kg"

                    }

                }

            }

        }

    });

}

</script>

</body>

</html>
